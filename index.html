<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300..900&display=swap" rel="stylesheet">
    <title>IRL Toolkit Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            display: none;
        }

        /* StreamElements Alerts - Green Area */
        .alerts {
            position: absolute;
            left: 20px;
            top: -290px;
            width: 1920px;
            height: 1080px;
            border: none;
            overflow: hidden;
            transform: scale(0.4);
            transform-origin: center;
            z-index: 2;
        }

        .alerts iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Chatis Chat - Blue Area */
        .chat {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 500px;
            height: 224px;
            border: none;
            overflow: hidden;
            z-index: 2;
        }

        .chat iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Sub Goal - Red Area */
        .goal {
            position: absolute;
            top: 530px;
            left: 1560px;
            width: 1920px;
            height: 1080px;
            border: none;
            overflow: hidden;
            transform: scale(0.3);
            transform-origin: left;
            z-index: 2;
        }

        .goal iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ep1cLIVE Socials - Bottom Right */
        .socials {
            position: absolute;
            left: -130px;
            top: 1040px;
            width: 633px;
            height: 355px;
            transform: scale(0.8);
            transform-origin: top right;
        }
        
        .socials iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>
<body>
    <!-- StreamElements Alerts - Green -->
    <div class="alerts">
        <iframe src="https://streamelements.com/overlay/6839e985d62ba99446a99049/CB26uHjJ_LhGM1WZF6oZW4fITkIZysjZ0Tb0cN9xo-V8ZKE-"></iframe>
    </div>

    <!-- Chatis Chat - Blue -->
    <div class="chat">
        <iframe src="https://chatis.is2511.com/v2/?channel=ep1cLIVE&animate=true&bots=true&size=1&font=0&fontCustom=Rubik&shadow=3&hide_special_badges=true&botNames=PotatBotat" allowfullscreen></iframe>
    </div>

    <!-- Sub Goal - Red -->
    <div class="goal">
        <iframe src="https://streamelements.com/overlay/69758ef309487fd66b0053a3/CB26uHjJ_LhGM1WZF6oZW4fITkIZysjZ0Tb0cN9xo-V8ZKE-"></iframe>
    </div>

    <!-- Socials -->
     <div class="socials">
        <iframe src="https://kicktools.app/socials_rotator/socials.html?preview=ep1cLIVE&size=18px&font=kanit&shadow=sm&vmargin=2&ig=ep1cLIVE&tt=ep1cLIVE&tw=ep1cLIVE&twitter=ep1cLIVE&yt=ep1cLIVEE&anim=up"></iframe>
     </div>

    <script>
        // You can add dynamic functionality here if needed
        // Update iframe sources as needed for your overlays
    </script>
</body>
</html>
