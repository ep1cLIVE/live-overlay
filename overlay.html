<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRL Toolkit Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* StreamElements Alerts - Green Area */
        .alerts {
            position: absolute;
            left: 441px;
            top: 48px;
            width: 573px;
            height: 206px;
            border: none;
            overflow: hidden;
            z-index: 2;
        }

        .alerts iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Chatis Chat - Blue Area */
        .chat {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 281px;
            height: 224px;
            border: none;
            overflow: hidden;
            z-index: 2;
        }

        .chat iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Follower/Sub Goal - Red Area */
        .goal {
            position: absolute;
            left: 0px;
            top: 856px;
            width: 281px;
            height: 224px;
            border: none;
            overflow: hidden;
            z-index: 2;
        }

        .goal iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Viewer Attack Browser Overlay - On Top */
        .attack-overlay {
            position: absolute;
            left: 0px;
            top: 0px;
            width: 1920px;
            height: 1080px;
            border: none;
            overflow: hidden;
            z-index: 100;
            pointer-events: auto;
        }

        .attack-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Loading Spinner */
        .spinner {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            z-index: 50;
        }

        .spinner-ring {
            border: 8px solid rgba(255, 255, 255, 0.3);
            border-top: 8px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- StreamElements Alerts - Green -->
    <div class="alerts">
        <iframe src="about:blank" allowfullscreen></iframe>
    </div>

    <!-- Chatis Chat - Blue -->
    <div class="chat">
        <iframe src="https://chatis.is2511.com/v2/?channel=ep1cLIVE&animate=true&bots=true&size=3&font=0&fontCustom=Rubik&shadow=3&hide_special_badges=true&botNames=PotatBotat" allowfullscreen></iframe>
    </div>

    <!-- Follower/Sub Goal - Red -->
    <div class="goal">
        <iframe src="about:blank" allowfullscreen></iframe>
    </div>

    <!-- Viewer Attack Overlay - On Top (Transparent) -->
    <div class="attack-overlay">
        <iframe id="attackFrame" src="about:blank" allowfullscreen></iframe>
    </div>

    <script>
        // You can add dynamic functionality here if needed
        // Update iframe sources as needed for your overlays
    </script>
</body>
</html>
